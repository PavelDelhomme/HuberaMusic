name: Build & Push YTMusic

on:
  push:
    branches: [prod, dev]
  workflow_dispatch:
    inputs:
      tag_preprod:
        description: 'Aussi pusher le tag :preprod (depuis la branche courante)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=preprod,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag_preprod }}
            type=sha,prefix=
            type=ref,event=branch

      - name: Read VERSION
        id: ver
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_REF=${{ github.ref_name }}
            APP_VERSION=${{ steps.ver.outputs.value }}

      - name: Ensure GHCR package is public
        if: github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="ytmusic"
          OWNER="${{ github.repository_owner }}"
          if gh api --method PATCH "/user/packages/container/${PKG}" -f visibility=public; then
            echo "OK — package user ${PKG} → public"
          elif gh api --method PATCH "/orgs/${OWNER}/packages/container/${PKG}" -f visibility=public; then
            echo "OK — package org ${PKG} → public"
          else
            echo "::warning::API visibility KO — passe le package en Public manuellement :"
            echo "https://github.com/users/${OWNER}/packages/container/${PKG}/settings"
            exit 0
          fi
