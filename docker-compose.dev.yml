# =============================================================================
# PLM — développement en conteneurs (API + Web Vite + Mailhog)
# =============================================================================
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ytmusic-api-dev
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: "8787"
      APP_ENV: local
      APP_URL: http://localhost:8787
      JWT_SECRET: ${JWT_SECRET:-dev-local-secret-change-me}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SEED_EMAIL: ${SEED_EMAIL:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:8787
      WEBAUTHN_ANDROID_ORIGINS: ${WEBAUTHN_ANDROID_ORIGINS:-android:apk-key-hash:PPbFMh2hUX55lAyeJVFKY5ssRJ4-_333R2h2y_b0wR8}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURE: "0"
      SMTP_FROM: PLM <noreply@ytmusic.local>
    volumes:
      - ytmusic_dev_data:/app/data
    depends_on:
      - mailhog
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # Hot-reload UI (optionnel) — proxy /api → api:8787
  web:
    image: node:22-bookworm-slim
    container_name: ytmusic-web-dev
    working_dir: /app
    command: bash -lc "npm ci && npm run dev -w web -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_ORIGIN: http://localhost:8787
      VITE_DEV_EMAIL: ${VITE_DEV_EMAIL:-}
      VITE_DEV_PASSWORD: ${VITE_DEV_PASSWORD:-}
    volumes:
      - ./:/app
      - ytmusic_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    profiles: ["hot"]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ytmusic-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  ytmusic_dev_data:
  ytmusic_node_modules:
